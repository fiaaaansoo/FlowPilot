[project]
name = "flowpilot-api"
version = "0.3.0"
description = "FlowPilot local recovery backend: context builder, semantic grounding, recovery agent, memory and telemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
# Optional, paid provider. Not needed for local models.
anthropic = ["anthropic==2.12.0"]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[project.scripts]
flowpilot-api = "flowpilot_api.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowpilot_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# French UI labels in fixtures legitimately contain typographic apostrophes.
"tests/**" = ["S105", "S106", "RUF001"]
